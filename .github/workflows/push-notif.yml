name: Send Push Notifications

on:
  schedule:
    - cron: '0 11 * * *'  # Todo dia às 8h de Brasília
  workflow_dispatch:        # Permite rodar manualmente também

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispara notificações
        run: |
          curl -X POST \
            https://nuwlfvrvacgemlcgskey.supabase.co/functions/v1/send-push-notifications \
            -H "Content-Type: application/json" \
            -d '{}'
