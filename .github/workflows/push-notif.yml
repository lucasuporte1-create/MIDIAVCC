name: Send Push Notifications

on:
  schedule:
    - cron: '0 10 * * *'   # Todo dia às 7h de Brasília (véspera e dia)
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Dispara notificações
        run: |
          curl -X POST \
            https://nuwlfvrvacgemlcgskey.supabase.co/functions/v1/send-push-notifications \
            -H "Content-Type: application/json" \
            -d '{}'
